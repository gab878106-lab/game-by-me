<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>€ Clicker</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Inter,Arial,sans-serif;
    color:white;
    background:
        radial-gradient(circle at 15% 10%,#292061 0,transparent 35%),
        radial-gradient(circle at 85% 90%,#075b55 0,transparent 32%),
        #07080e;
}

button,input{font-family:inherit}

/* ================= AUTH ================= */

#authScreen{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at 50% 30%,rgba(99,87,230,.25),transparent 45%),
        #07080e;
}

.auth-box{
    width:420px;
    max-width:100%;
    padding:32px;
    border-radius:25px;
    background:rgba(16,17,28,.94);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 25px 100px rgba(0,0,0,.6);
    backdrop-filter:blur(25px);
}

.auth-logo{
    text-align:center;
    font-size:32px;
    font-weight:900;
}

.auth-logo span,
.logo span{
    color:#8174ff;
}

.auth-subtitle{
    text-align:center;
    color:#777986;
    font-size:12px;
    margin:5px 0 25px;
}

.auth-tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:20px;
}

.auth-tab{
    padding:11px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    color:#888;
    background:#22232e;
    font-weight:bold;
}

.auth-tab.active{
    color:white;
    background:#6357e6;
}

.auth-form{
    display:none;
}

.auth-form.active{
    display:block;
}

.auth-label{
    display:block;
    margin:13px 0 6px;
    color:#aaa;
    font-size:12px;
}

.auth-input{
    width:100%;
    padding:13px;
    border-radius:11px;
    border:1px solid rgba(255,255,255,.08);
    outline:none;
    color:white;
    background:#0d0e16;
}

.auth-input:focus{
    border-color:#7064ff;
    box-shadow:0 0 0 3px rgba(112,100,255,.1);
}

.auth-submit{
    width:100%;
    margin-top:20px;
    padding:13px;
    border:0;
    border-radius:11px;
    cursor:pointer;
    color:white;
    background:linear-gradient(90deg,#6357e6,#8174ff);
    font-weight:900;
}

.auth-message{
    min-height:18px;
    margin-top:12px;
    text-align:center;
    font-size:12px;
    color:#ff7777;
}

.auth-note{
    margin-top:18px;
    color:#666875;
    text-align:center;
    font-size:10px;
    line-height:1.5;
}
/* ================= BAN ================= */

#banScreen{
    position:fixed;
    inset:0;
    z-index:20000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at 50% 25%,rgba(255,70,70,.18),transparent 45%),
        #07080e;
}

#banScreen.show{
    display:flex;
}

.ban-box{
    width:500px;
    max-width:100%;
    padding:35px;
    text-align:center;
    border-radius:25px;
    background:rgba(20,15,22,.96);
    border:1px solid rgba(255,80,80,.25);
    box-shadow:0 25px 100px rgba(0,0,0,.7);
}

.ban-icon{
    font-size:65px;
    margin-bottom:10px;
}

.ban-title{
    margin:0;
    color:#ff7070;
    font-size:30px;
    font-weight:900;
}

.ban-text{
    margin:12px 0 25px;
    color:#aaa;
    font-size:14px;
    line-height:1.6;
}

.ban-info{
    padding:17px;
    text-align:left;
    border-radius:15px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.07);
}

.ban-info-row{
    margin:8px 0;
    color:#aaa;
    font-size:13px;
}

.ban-info-row strong{
    color:white;
}

.ban-logout{
    width:100%;
    margin-top:20px;
    padding:13px;
    border:0;
    border-radius:11px;
    cursor:pointer;
    color:white;
    background:#b83b3b;
    font-weight:900;
}

.ban-logout:hover{
    background:#d34a4a;
}
/* ================= HEADER ================= */

header{
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:0 32px;
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(8,9,15,.82);
    border-bottom:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
}

.logo{
    font-size:25px;
    font-weight:900;
}

.header-stats{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.header-pill{
    padding:9px 14px;
    border-radius:30px;
    background:rgba(124,108,255,.11);
    border:1px solid rgba(124,108,255,.25);
    color:#c0baff;
    font-size:13px;
    font-weight:bold;
}

.user-pill{
    color:#67ffac;
    border-color:rgba(103,255,172,.2);
    background:rgba(103,255,172,.07);
}

.logout{
    border:0;
    cursor:pointer;
    color:#ff8b8b;
    background:transparent;
    font-weight:bold;
}

/* ================= GAME ================= */

.game{
    width:1350px;
    max-width:95%;
    margin:28px auto;
    display:grid;
    grid-template-columns:minmax(350px,1fr) 500px;
    gap:22px;
}

.panel{
    background:rgba(16,17,28,.86);
    border:1px solid rgba(255,255,255,.075);
    border-radius:25px;
    padding:26px;
    box-shadow:0 20px 70px rgba(0,0,0,.35);
    backdrop-filter:blur(20px);
}

.sticky-game{
    position:sticky;
    top:100px;
    align-self:start;
}

.money-title{
    text-align:center;
    color:#858694;
    text-transform:uppercase;
    letter-spacing:2px;
    font-size:12px;
}

.money{
    text-align:center;
    font-size:clamp(42px,6vw,72px);
    font-weight:900;
    margin:6px 0 25px;
    background:linear-gradient(90deg,#fff,#aaa1ff,#67ffb1);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    word-break:break-word;
}

.click-zone{
    display:flex;
    justify-content:center;
    margin:28px 0;
}

#clickButton{
    width:235px;
    height:235px;
    border-radius:50%;
    border:0;
    cursor:pointer;
    color:white;
    font-weight:900;
    font-size:27px;
    background:radial-gradient(circle at 35% 28%,#9389ff,#5d50ea 52%,#322798);
    box-shadow:
        0 0 30px rgba(108,92,255,.6),
        0 0 100px rgba(108,92,255,.23),
        inset 0 0 35px rgba(255,255,255,.14);
    transition:.1s;
}

#clickButton:hover{
    transform:scale(1.03);
}

#clickButton:active{
    transform:scale(.91);
}

.floating{
    position:fixed;
    z-index:999;
    pointer-events:none;
    color:#66ffab;
    font-size:23px;
    font-weight:900;
    animation:floatingMoney .85s ease-out forwards;
}

@keyframes floatingMoney{
    0%{
        opacity:1;
        transform:translate(-50%,0) scale(.8);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-100px) scale(1.35);
    }
}

/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.stat{
    padding:15px;
    border-radius:15px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.06);
    text-align:center;
}

.stat-icon{
    font-size:23px;
}

.stat-value{
    margin-top:5px;
    font-size:19px;
    font-weight:bold;
}

.stat-label{
    margin-top:4px;
    color:#777986;
    font-size:10px;
    letter-spacing:1px;
}

/* ================= XP ================= */

.xp-box{
    margin-top:20px;
}

.xp-info{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
    color:#8b8c9a;
    font-size:12px;
}

.xp-bar{
    height:10px;
    border-radius:20px;
    background:#242531;
    overflow:hidden;
}

.xp-progress{
    width:0;
    height:100%;
    border-radius:20px;
    background:linear-gradient(90deg,#6f61ff,#9f95ff);
    transition:width .25s;
}

/* ================= PRESTIGE ================= */

.prestige-box{
    margin-top:22px;
    padding:20px;
    border-radius:18px;
    background:
        radial-gradient(circle at 80% 20%,rgba(255,196,68,.16),transparent 40%),
        rgba(255,193,58,.05);
    border:1px solid rgba(255,196,68,.25);
}

.prestige-title{
    font-size:20px;
    font-weight:900;
    color:#ffd96a;
}

.prestige-desc{
    margin:8px 0 15px;
    color:#aaa9a0;
    font-size:12px;
    line-height:1.5;
}

.prestige-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:13px;
}

.prestige-stat{
    padding:10px;
    text-align:center;
    border-radius:12px;
    background:rgba(255,255,255,.04);
}

.prestige-stat strong{
    display:block;
    color:#ffe397;
    font-size:18px;
}

.prestige-stat span{
    color:#86847b;
    font-size:10px;
}

#prestigeButton{
    width:100%;
    padding:13px;
    border:0;
    border-radius:12px;
    cursor:pointer;
    font-size:14px;
    font-weight:900;
    color:#281d00;
    background:linear-gradient(90deg,#f6ba31,#ffe787);
}

#prestigeButton:disabled{
    cursor:not-allowed;
    color:#777;
    background:#292a31;
}

/* ================= SHOP ================= */

.shop-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:17px;
}

.shop-header h2{
    margin:0;
    font-size:24px;
}

.shop-subtitle{
    color:#737481;
    font-size:11px;
}

.shop-list{
    max-height:calc(100vh - 155px);
    padding-right:5px;
    overflow-y:auto;
}

.shop-list::-webkit-scrollbar{
    width:6px;
}

.shop-list::-webkit-scrollbar-thumb{
    border-radius:10px;
    background:#393a48;
}

.upgrade{
    position:relative;
    margin-bottom:11px;
    padding:17px;
    border-radius:17px;
    background:linear-gradient(
        135deg,
        rgba(255,255,255,.055),
        rgba(255,255,255,.018)
    );
    border:1px solid rgba(255,255,255,.07);
    transition:.2s;
}

.upgrade:hover{
    transform:translateY(-2px);
    border-color:rgba(124,108,255,.42);
    background:rgba(124,108,255,.075);
}

.upgrade-top{
    display:flex;
    align-items:center;
    gap:13px;
}

.upgrade-icon{
    flex:0 0 auto;
    width:48px;
    height:48px;
    display:grid;
    place-items:center;
    border-radius:13px;
    background:rgba(124,108,255,.12);
    border:1px solid rgba(124,108,255,.2);
    font-size:24px;
}

.upgrade-name{
    margin:0 65px 0 0;
    font-size:15px;
}

.upgrade-description{
    margin:5px 0 0;
    color:#80818d;
    font-size:11px;
    line-height:1.45;
}

.owned{
    position:absolute;
    top:15px;
    right:15px;
    padding:4px 8px;
    border-radius:8px;
    color:#67ffac;
    background:rgba(101,255,161,.1);
    font-size:10px;
    font-weight:bold;
}

.buy{
    width:100%;
    margin-top:13px;
    padding:10px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    color:white;
    background:#6357e6;
    font-size:12px;
    font-weight:bold;
    transition:.18s;
}

.buy:hover:not(:disabled){
    transform:translateY(-1px);
    background:#796eff;
}

.buy:disabled{
    cursor:not-allowed;
    color:#656671;
    background:#292a34;
}
